[package]
name = "backcounty"
edition = "2021"
authors = ["Ram Poudel"]
description = "A crud based backend application file"

[workspace.package]
edition = "2021"

[workspace]
members = [
    "routes",
    "db",
    "services/blog",
    "services/auth-service",
    "model",
    "migration"
]
resolver = "1"

[workspace.dependencies]
model={path = "./model" }
routes = { path = "./routes" }
db = { path = "./db" }
migration={path="./migration"}
auth-service = {path = "./services/auth-service"}

#ayncs
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
async-trait = "0.1.88"


#webservers
axum = { version = "0.8.4" }
axum-extra = { version="0.10.1",features = ["cookie"] }
tower = { version = "0.5.2" }
tower-http = { version = "0.6.6", features = ["cors"] }
reqwest = { version = "0.12.22", features = ["json"] }
cookie = "0.18.1"
http = "1.3.1"

#database
sea-orm = { version = "1.1.14", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = "1.1.14"

#serialization and deserialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

#error and debugging
thiserror = "2.0.12"


#others
dotenv = "0.15.0"
uuid = { version="1.17.0",features = ["v4","serde"] }
chrono = { version = "0.4.41",features = ["serde"] }

#securities
jsonwebtoken = "9.3.1"

[dependencies]
model.workspace = true
routes.workspace = true
db.workspace = true
tokio.workspace = true
thiserror.workspace = true
auth-service.workspace = true
