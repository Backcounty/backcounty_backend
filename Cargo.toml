[package]
name = "backcounty"
edition = "2021"
authors = ["Ram Poudel"]
description = "A crud based backend application file"

[workspace.package]
edition = "2021"

[workspace]
members = [
    "routes",
    "db",
    "blog",
    "auth"
]
resolver = "1"

[workspace.dependencies]
#ayncs
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.4" }
async-trait = "0.1.88"

#requests and http
tower = { version = "0.5.2" }
tower-http = { version = "0.6.6", features = ["cors"] }
reqwest = { version = "0.12.22", features = ["json"] }

#database
sea-orm = { version = "1.1.14", features = ["sqlx-postgres", "runtime-tokio-native-tls", "macros"] }
sea-orm-migration = "1.1.14"

#serialization and deserialization
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

#error and debugging
thiserror = "2.0.12"


#others
dotenv = "0.15.0"

[dependencies]
routes = { path = "./routes" }
db = { path = "./db" }
tokio.workspace = true